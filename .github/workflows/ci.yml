name: CI

on:
  push:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt
      - run: pytest -m "not slow"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t finance-sentiment .
      - name: Smoke test the image
        run: |
          docker run -d -p 7860:7860 --name app finance-sentiment
          for i in $(seq 1 60); do curl -sf localhost:7860/health && break; sleep 2; done
          curl -sf localhost:7860/ | grep -q '<div id="root">'
          curl -sf -X POST localhost:7860/api/sentiment/analyze -H 'Content-Type: application/json' \
            -d '{"text": "The company cuts its outlook after a large quarterly loss"}' | tee out.json
          grep -q '"model":"finbert"' out.json
          grep -q '"sentiment":"negative"' out.json
      - name: Show the app's log if a step failed
        if: failure()
        run: docker logs app
